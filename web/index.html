<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <!-- Primary SEO -->
  <meta name="description" content="Discover handcrafted pottery and ceramics from Pottery Station Ramgarh. Shop exclusive hand-thrown bowls, vases, mugs and artisan clay creations.">
  <meta name="keywords" content="handmade pottery, ceramics, Ramgarh, hand-thrown pottery, pottery India, clay art, artisan pottery, pottery shop, handcrafted ceramics, pottery Jharkhand">

  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.potterystationramgarh.in"/>

  <!-- Open Graph (WhatsApp, Facebook previews) -->

  <meta property="og:url" content="https://www.potterystationramgarh.in"/>
  <meta property="og:title" content="Pottery Station Ramgarh | Handmade Ceramics & Pottery"/>

  <meta property="og:image" content="https://www.potterystationramgarh.in/icons/Icon-512.png"/>

  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Pottery Station Ramgarh | Handmade Ceramics & Pottery"/>
  <meta name="twitter:description" content="Discover handcrafted pottery and ceramics from Ramgarh. Shop exclusive hand-thrown bowls, vases, mugs and artisan clay creations."/>

  <!-- Theme & Mobile -->
  <meta name="theme-color" content="#8B5E3C"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Pottery Station Ramgarh"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Favicon / Web Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png"/>
  <link rel="shortcut icon" href="favicon.png"/>
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <title>Pottery Station — Artisan Pottery & Workshops</title>
  <link rel="manifest" href="manifest.json">
